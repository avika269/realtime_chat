<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat Application</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <section id="login">

      <h1>Join Chat</h1>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
      >

      <input
        type="text"
        id="room"
        placeholder="Enter room"
      >

      <button id="joinBtn">
        Join Room
      </button>

    </section>

    <section id="chat" class="hidden">

      <header>

        <h1 id="roomTitle">
          Chat Room
        </h1>

      </header>

      <div id="messages"></div>

      <div id="activity"></div>

      <form id="messageForm">

        <input
          type="text"
          id="messageInput"
          placeholder="Type a message..."
          autocomplete="off"
        >

        <button type="submit">
          Send
        </button>

      </form>

      <aside>

        <h3>Users</h3>

        <ul id="userList"></ul>

      </aside>

    </section>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

</body>

</html>
