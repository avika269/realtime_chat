<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section id="loginPage" class="page">
    <div class="authBox">
      <h1>ChatApp</h1>
      <p>Login to continue</p>

      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <p id="loginMessage"></p>

      <button class="secondaryButton" onclick="showPage('registerPage')">
        Create account
      </button>
    </div>
  </section>


  <section id="registerPage" class="page" hidden>
    <div class="authBox">
      <h1>Create Account</h1>

      <form id="registerForm">
        <input id="registerUsername" type="text" placeholder="Username" required>
        <input id="registerEmail" type="email" placeholder="Email" required>
        <input id="registerPassword" type="password" placeholder="Password" required>
        <button type="submit">Register</button>
      </form>

      <p id="registerMessage"></p>

      <button class="secondaryButton" onclick="showPage('loginPage')">
        Back to Login
      </button>
    </div>
  </section>


  <section id="chatPage" class="chatPage page" hidden>

    <aside class="sidebar">

      <div class="sidebarHeader">
        <div>
          <h2>ChatApp</h2>
          <span id="currentUsername"></span>
        </div>

        <div class="headerActions">
          <button onclick="openProfile()">Profile</button>
          <button onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="searchBox">
        <input id="userSearch" type="text" placeholder="Search users">
      </div>

      <div class="sidebarTabs">
        <button onclick="showSidebar('chats')">Chats</button>
        <button onclick="showSidebar('users')">Users</button>
        <button onclick="showSidebar('calls')">Calls</button>
      </div>

      <div id="chatList" class="sidebarList"></div>
      <div id="usersList" class="sidebarList" hidden></div>
      <div id="callsList" class="sidebarList" hidden></div>

    </aside>


    <main class="chatArea">

      <header class="chatHeader">

        <div>
          <h3 id="activeChatName">Select a chat</h3>
          <span id="activeChatStatus"></span>
        </div>

        <div class="chatActions">
          <button onclick="startAudioCall()">Audio</button>
          <button onclick="startVideoCall()">Video</button>
          <button onclick="openUserProfile()">Info</button>
        </div>

      </header>


      <div id="typingIndicator"></div>

      <div id="messages" class="messages"></div>


      <div id="replyBox" class="replyBox" hidden>
        <span id="replyText"></span>
        <button onclick="cancelReply()">×</button>
      </div>


      <form id="messageForm" class="messageForm">

        <button
          type="button"
          id="attachmentButton"
          onclick="document.getElementById('fileInput').click()">
          +
        </button>

        <input
          id="fileInput"
          type="file"
          hidden
          accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip">

        <input
          id="messageInput"
          type="text"
          placeholder="Type a message..."
          autocomplete="off">

        <button type="button" onclick="sendEmoji()">😊</button>

        <button type="submit">Send</button>

      </form>

    </main>


    <aside id="profilePanel" class="profilePanel" hidden>

      <div class="profileHeader">
        <h2>My Profile</h2>
        <button onclick="closeProfile()">×</button>
      </div>

      <div class="profileContent">
        <div class="profileAvatar" id="myAvatar">A</div>

        <h3 id="profileUsername"></h3>
        <p id="profileEmail"></p>

        <textarea id="profileAbout" placeholder="About"></textarea>

        <button onclick="saveProfile()">
          Save Profile
        </button>
      </div>

    </aside>

  </section>


  <section id="callPage" class="callPage page" hidden>

    <div class="callHeader">
      <h2 id="callStatus">Calling...</h2>
      <button onclick="endCall()">End Call</button>
    </div>

    <div class="videoContainer">

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>

    <div class="callControls">
      <button onclick="toggleCamera()">Camera</button>
      <button onclick="toggleMicrophone()">Microphone</button>
      <button onclick="endCall()">End</button>
    </div>

  </section>


  <div id="incomingCall" class="incomingCall" hidden>

    <div class="incomingBox">

      <h2>Incoming Call</h2>

      <p id="callerName"></p>
      <p id="callerType"></p>

      <div>
        <button onclick="acceptCall()">Accept</button>
        <button onclick="rejectCall()">Reject</button>
      </div>

    </div>

  </div>


  <div id="userProfileModal" class="modal" hidden>

    <div class="modalBox">

      <button class="closeModal" onclick="closeUserProfile()">×</button>

      <div class="profileAvatar" id="otherAvatar">U</div>

      <h2 id="otherUsername"></h2>
      <p id="otherAbout"></p>
      <p id="otherStatus"></p>

      <button onclick="addContact()">
        Add Contact
      </button>

      <button onclick="blockUser()">
        Block User
      </button>

      <button onclick="startVideoCall()">
        Video Call
      </button>

      <button onclick="startAudioCall()">
        Audio Call
      </button>

    </div>

  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

</body>
</html>
